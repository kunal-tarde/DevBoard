<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevBoard — Task Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-purple-950 to-slate-900 text-slate-100 min-h-screen flex flex-col items-center py-10 px-4">

    <!-- App Container -->
    <div class="w-full max-w-md bg-white/10 backdrop-blur-xl border border-white/10 rounded-2xl p-6 shadow-2xl shadow-purple-950/50">
        
        <!-- Header -->
        <header class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">DevBoard</h1>
                <p class="text-xs text-slate-400">Streamline your dev workflow</p>
            </div>
            <span class="bg-purple-500/20 border border-purple-500/30 text-purple-300 text-xs px-2.5 py-1 rounded-full font-medium" id="task-counter">3 tasks</span>
        </header>

        <!-- Input Form -->
        <form id="task-form" class="flex gap-2 mb-6">
            <input type="text" id="task-input" placeholder="Deploy v1.2 to staging..." required
                class="flex-1 bg-black/30 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-purple-500 transition">
            <button type="submit" class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-medium px-4 py-2.5 rounded-xl text-sm transition shadow-lg shadow-purple-600/30">
                Add
            </button>
        </form>

        <!-- Task List -->
        <ul id="task-list" class="space-y-3">
            <!-- Dynamic items will load here -->
        </ul>
    </div>

    <!-- Minimal Script -->
    <script>
        const form = document.getElementById('task-form');
        const input = document.getElementById('task-input');
        const list = document.getElementById('task-list');
        const counter = document.getElementById('task-counter');

        let tasks = [
            { id: 1, text: 'Fix CORS policy on auth endpoint', done: true },
            { id: 2, text: 'Refactor Tailwind grid components', done: false },
            { id: 3, text: 'Write unit tests for payment webhook', done: false }
        ];

        function render() {
            list.innerHTML = '';
            tasks.forEach(task => {
                const li = document.createElement('li');
                li.className = `flex items-center justify-between p-3 rounded-xl border transition ${task.done ? 'bg-white/5 border-white/5 opacity-60' : 'bg-white/10 border-white/10'}`;
                li.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <input type="checkbox" ${task.done ? 'checked' : ''} onclick="toggleTask(${task.id})"
                            class="w-4 h-4 rounded accent-purple-500 cursor-pointer">
                        <span class="text-sm truncate ${task.done ? 'line-through text-slate-400' : 'text-slate-200'}">${task.text}</span>
                    </div>
                    <button onclick="deleteTask(${task.id})" class="text-slate-500 hover:text-pink-400 transition text-sm px-1">×</button>
                `;
                list.appendChild(li);
            });
            const remaining = tasks.filter(t => !t.done).length;
            counter.innerText = `${remaining} pending`;
        }

        function toggleTask(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
            render();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            render();
        }

        form.addEventListener('submit', e => {
            e.preventDefault();
            if (!input.value.trim()) return;
            tasks.push({ id: Date.now(), text: input.value.trim(), done: false });
            input.value = '';
            render();
        });

        render();
    </script>
</body>
</html>
